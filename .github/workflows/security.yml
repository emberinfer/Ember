name: Public repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Scan secrets and public documentation
        run: bash security/secret-scan.sh
