name: Deploy site to GitHub Pages
on:
  push:
    branches: [master]
    paths:
      - site/**
      - .github/workflows/pages.yml
      - release/profile_pages.py
      - release/check-profile-pages.sh
      - chain-genesis/**
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify profile pages against signed artifacts and consensus
        run: |
          python3 -m pip install cryptography==50.0.2 protobuf==7.36.2
          go build -o /tmp/ember-profile-chain ./cmd/emberchain
          PROFILE_CHAIN_CLI=/tmp/ember-profile-chain bash release/check-profile-pages.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
